# PR과 dev/main 푸시마다 서비스별 테스트. 로컬 `make test`와 같은 조건(테스트 DB patchradar_test, 호스트 15432)을 맞춘다.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [collector-svc, release-svc]
    # 테스트용 인프라. 앱 설정의 기본값(localhost:15432, patchradar/patchradar)과 맞춘다
    services: &infra
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patchradar
          POSTGRES_PASSWORD: patchradar
          POSTGRES_DB: patchradar_test
        ports: ["15432:5432"]
        options: --health-cmd "pg_isready -U patchradar" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  summary-svc:
    runs-on: ubuntu-latest
    services: *infra
    defaults:
      run:
        working-directory: services/summary-svc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/summary-svc/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -q
        env:
          DB_NAME: patchradar_test   # 실제 Gemini는 호출하지 않는다(가짜 클라이언트)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
