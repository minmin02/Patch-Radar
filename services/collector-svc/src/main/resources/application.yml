server:
  port: 8081

spring:
  application:
    name: collector-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:patchradar}?currentSchema=collector
    username: ${DB_USER:patchradar}
    password: ${DB_PASSWORD:patchradar}
  flyway:
    default-schema: collector   # 서비스별 스키마. 다른 서비스 스키마는 읽지 않는다
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info

patchradar:
  github:
    token: ${GITHUB_TOKEN:}   # 없으면 비인증(시간당 60회)
