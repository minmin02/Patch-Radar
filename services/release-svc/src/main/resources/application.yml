server:
  port: 8080

spring:
  application:
    name: release-svc
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:patchradar}?currentSchema=release
    username: ${DB_USER:patchradar}
    password: ${DB_PASSWORD:patchradar}
  flyway:
    default-schema: release   # 서비스별 스키마. 다른 서비스 스키마는 읽지 않는다
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
