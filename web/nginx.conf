server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker 내장 DNS를 요청마다 조회: release-svc가 재생성돼 IP가 바뀌어도 따라감
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $release_svc http://release-svc:8080;

  location /api/ {
    proxy_pass $release_svc;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;        # SSE(/api/releases/stream) 즉시 전달
    proxy_read_timeout 1h;
  }

  location / {
    try_files $uri /index.html;
  }
}
